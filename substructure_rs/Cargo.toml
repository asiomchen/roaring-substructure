[package]
name = "substructure_rs"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust SMILES/SMARTS substructure search with a posting-list screen"

[lib]
name = "substructure_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "substructure_rs"
path = "src/main.rs"

[features]
# Python bindings, enabled by maturin (see pyproject.toml).
python = ["dep:pyo3"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"], optional = true }
parquet = { version = "60.0.0", default-features = false, features = ["zstd"] }
rayon = "1.12.0"
sha2 = "0.11.0"
